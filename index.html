<style>

<style>
/* Layout: a single scrolling ledger — sticky header with range + import, tabbed views, list rows that open a detail sheet */
:root{
  --bg:#F7F7F7; --surface:#FFFFFF; --ink:#0F0F0F; --muted:#606060; --line:#E3E3E3;
  --accent:#E00000; --accent-soft:#FFE6E6; --warm:#A50E0E; --on-accent:#FFFFFF;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#030303; --surface:#181818; --ink:#FFFFFF; --muted:#AAAAAA; --line:#2C2C2C;
  --accent:#FF0000; --accent-soft:#3B0A0A; --warm:#FF8A80; --on-accent:#FFFFFF; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#030303; --surface:#181818; --ink:#FFFFFF; --muted:#AAAAAA; --line:#2C2C2C;
  --accent:#FF0000; --accent-soft:#3B0A0A; --warm:#FF8A80; --on-accent:#FFFFFF; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
h1{font:800 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.src{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
select,input[type=search]{font:500 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.btn{font:600 14px var(--body);border-radius:8px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.row:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tab{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-bottom:20px;font-size:14px}
.notice b{font-weight:600}
.notice .grow{flex:1;min-width:220px}
.err{background:color-mix(in oklab,var(--warm) 18%,var(--surface));}

h2{font:700 19px/1.2 var(--display);margin:0 0 12px;text-wrap:balance}
h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
section.view{display:grid;gap:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hero div{background:var(--surface);padding:16px}
.hero .big{font:800 34px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .unit{font:600 13px var(--body);color:var(--muted);margin-left:4px}
.hero .sub{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:640px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .big{font-size:28px}}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}

.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)} .chart .bar.hi{fill:var(--warm)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:10px var(--mono)}

.list{display:grid}
.row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;font:inherit;width:100%}
.row:hover{background:color-mix(in oklab,var(--accent-soft) 50%,transparent)}
.rank{font:600 13px var(--mono);color:var(--muted);text-align:right}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.stats{display:flex;gap:14px;font:13px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.stats span{display:grid;min-width:3.2em}
.stats small{font:500 10px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:560px){.stats .opt{display:none}}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.controls input{flex:1;min-width:160px}
.more{margin-top:12px}

.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}
.ins .v{font:700 22px/1.15 var(--display);font-variant-numeric:tabular-nums}
.ins .d{font-size:13px;color:var(--muted)}
.ins .d b{color:var(--ink);font-weight:600}

.heatwrap{overflow-x:auto}
.heat{display:grid;grid-template-columns:2.4em repeat(24,minmax(11px,1fr));gap:2px;min-width:320px}
.heat .c{aspect-ratio:1;border-radius:2px;max-width:100%}
.heat .l{font:10px var(--mono);color:var(--muted);display:flex;align-items:center}
.heat .h{font:9px var(--mono);color:var(--muted);text-align:center}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}

.track{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.track .tm{font-family:var(--mono);color:var(--muted)}
.track .s{color:var(--warm);font:600 11px var(--body);text-transform:uppercase;letter-spacing:.05em}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in oklab,var(--ink) 40%,transparent)}
.sheet .card{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));display:grid;gap:18px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:16px}}
.sheet .head{display:flex;gap:12px;align-items:flex-start}
.sheet .head div{flex:1;min-width:0}
.sheet h2{margin:0 0 4px;font-size:24px}
.close{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv div{display:grid}
.kv b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
a{color:var(--accent)}
.how ol{margin:0;padding-left:1.3em;display:grid;gap:8px;max-width:65ch}
.how p{max-width:65ch;color:var(--muted);font-size:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.fine{font-size:12px;color:var(--muted)}
.chartbox{display:grid;gap:8px}
.sum{font-size:15px;max-width:65ch}
.sum b{font-weight:600}
.readout{font-size:14px;min-height:1.5em}
.readout.hint{font-size:12px;color:var(--muted)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar.hi{fill:color-mix(in oklab,var(--accent) 65%,var(--ink))}
.chart .bar.sel{fill:var(--ink)}
.chart .val{fill:var(--ink);font:600 10px var(--mono)}
.chart .ttl{font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase}
.heat .c{cursor:pointer}
.heat .c.sel{outline:2px solid var(--warm);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 14px var(--mono);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.delta{font:600 12px var(--mono)} .up{color:var(--accent)} .down{color:var(--warm)}
.mrow{grid-template-columns:3em minmax(0,1fr) auto}
.mname{font:700 15px var(--display)}
.track.row{cursor:pointer}
.namelist{font-size:14px;color:var(--muted);max-width:65ch}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.sechead h2{margin:0 auto 0 0}
.sechead input{font:500 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ptiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ptile{display:grid;gap:2px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);cursor:pointer;font:inherit}
.ptile[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.ptile:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.ptile .pn{font-weight:600;font-size:13px}.ptile .pt{font:11px var(--mono);color:var(--muted)}.ptile .pv{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:600 12px var(--body);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;margin-top:6px}
.cardwrap{display:grid;justify-items:center}
.cardwrap img{display:block;width:100%;max-width:340px;height:auto;border-radius:14px;border:1px solid var(--line)}
.cardbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.otd .v{font-size:19px}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:background .15s}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="var(--ink)"/><circle cx="15" cy="15" r="9.5" fill="none" stroke="var(--muted)" stroke-width=".6"/><circle cx="15" cy="15" r="6.5" fill="none" stroke="var(--muted)" stroke-width=".6"/><circle cx="15" cy="15" r="3.6" fill="var(--accent)"/><circle cx="15" cy="15" r="1" fill="var(--ink)"/></svg>
        <div style="min-width:0"><h1>Listening Ledger</h1><div class="src" id="src">Sample data</div></div>
      </div>
      <label for="range" class="fine" hidden>Time range</label>
      <select id="range" aria-label="Time range"></select>
      <button class="btn" id="importBtn" type="button">Import my history</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-v="overview">Overview</button>
      <button class="tab" role="tab" data-v="insights">Insights</button>
      <button class="tab" role="tab" data-v="songs">Songs</button>
      <button class="tab" role="tab" data-v="artists">Artists</button>
      <button class="tab" role="tab" data-v="periods">Months &amp; years</button>
      <button class="tab" role="tab" data-v="patterns">When you listen</button>
      <button class="tab" role="tab" data-v="sessions">Sessions &amp; repeats</button>
      <button class="tab" role="tab" data-v="import">Import</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="notice"></div>
  <div id="view"></div>
</main>
<input type="file" id="file" accept=".zip,.json,.html,application/zip,application/json,text/html" hidden>
<div id="sheet" class="sheet" hidden></div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat();
const fmtN=n=>nf.format(Math.round(n));
const fmtShort=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':String(Math.round(v));
const fmtH=sec=>{const h=sec/3600;return h>=100?fmtN(h):h.toFixed(1)};
const fmtDur=sec=>{const m=Math.round(sec/60);if(m<60)return m+' min';const h=Math.floor(m/60);return h+' h '+(m%60)+' min'};
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtTime=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const hourLabel=h=>h===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p';

let DB=null;
const ST={range:'all',view:'overview',songSort:'plays',artistSort:'plays',songLimit:50,artistLimit:50,q:'',aq:'',year:null,sessAll:false,otd:null,period:null};
const VIEWS=['overview','insights','songs','artists','periods','patterns','sessions','import'];
let AGG=null;

/* ---------- Parsing Google Takeout ---------- */
function cleanArtist(n){n=(n||'').replace(/ - Topic$/,'').replace(/VEVO$/,'').trim();return n||'Unknown artist'}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDate(str){
  if(!str)return NaN;const x=str.replace(/[  ]/g,' ');
  let m=x.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?[Mm]\.?)?/),mo,d,y,h,mi,se,ap;
  if(m){mo=MON[m[1].toLowerCase()];d=+m[2];y=+m[3];h=+m[4];mi=+m[5];se=+(m[6]||0);ap=m[7]}
  else{m=x.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?[Mm]\.?)?/);
    if(m){d=+m[1];mo=MON[m[2].toLowerCase()];y=+m[3];h=+m[4];mi=+m[5];se=+(m[6]||0);ap=m[7]}}
  if(mo===undefined)return Date.parse(x);
  if(ap){const pm=/p/i.test(ap);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}
  return new Date(y,mo,d,h,mi,se).getTime();
}
const strip=s=>s.replace(/<[^>]*>/g,'');
const decode=s=>s.replace(/&nbsp;/g,' ').replace(/&quot;/g,'"').replace(/&#39;|&#x27;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,'&');
const isMusicEntry=e=>e.header==='YouTube Music'||(Array.isArray(e.products)&&e.products.includes('YouTube Music'));
function parseJSON(text){
  const arr=JSON.parse(text),out=[];
  for(const e of arr){
    if(!isMusicEntry(e)||!e.title)continue;
    const title=e.title.replace(/^(Watched|Listened to)\s+/,'').trim();
    if(!title||/^https?:\/\//.test(title))continue;
    const ch=e.subtitles&&e.subtitles[0]?e.subtitles[0].name:'';
    out.push({time:Date.parse(e.time),title,url:e.titleUrl||'',artist:cleanArtist(ch)});
  }
  return out;
}
function parseHTML(html){
  const out=[],parts=html.split('outer-cell');
  for(let i=1;i<parts.length;i++){
    const p=parts[i],hm=p.match(/mdl-typography--title">([\s\S]*?)<\/p>/);if(!hm)continue;
    if(decode(strip(hm[1])).trim()!=='YouTube Music')continue;
    const cm=p.match(/content-cell[^"]*mdl-typography--body-1">([\s\S]*?)<\/div>/);if(!cm)continue;
    const c=cm[1],links=[...c.matchAll(/<a href="([^"]*)">([\s\S]*?)<\/a>/g)];if(!links.length)continue;
    const title=decode(strip(links[0][2])).trim();if(!title||/^https?:\/\//.test(title))continue;
    const segs=c.split(/<br\s*\/?>/).map(x=>decode(strip(x)).trim()).filter(Boolean);
    out.push({time:parseDate(segs[segs.length-1]),title,url:decode(links[0][1]),artist:cleanArtist(links[1]?decode(strip(links[1][2])):'')});
  }
  return out;
}

/* ---------- Building the dataset ---------- */
function build(entries,meta){
  entries=entries.filter(e=>isFinite(e.time)).sort((a,b)=>a.time-b.time);
  const ded=[];for(const e of entries){const p=ded[ded.length-1];if(p&&p.time===e.time&&p.title===e.title)continue;ded.push(e)}
  const aI=new Map(),artists=[],sI=new Map(),songs=[],n=ded.length,t=new Float64Array(n),s=new Int32Array(n);
  ded.forEach((e,i)=>{let a=aI.get(e.artist);if(a===undefined){a=artists.length;artists.push(e.artist);aI.set(e.artist,a)}
    const key=e.title+'\u0001'+a;let k=sI.get(key);if(k===undefined){k=songs.length;songs.push({title:e.title,a,url:e.url||''});sI.set(key,k)}
    t[i]=e.time;s[i]=k});
  return finalize({songs,artists,t,s,...meta});
}
const median=a=>{if(!a.length)return 0;a.sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
function finalize(d){
  const {t,s,songs,artists}=d,n=t.length,gap=new Float32Array(n),per=songs.map(()=>[]),all=[];
  for(let i=0;i<n;i++){const g=i<n-1?(t[i+1]-t[i])/1000:Infinity;gap[i]=g;if(g>=40&&g<=720){per[s[i]].push(g);all.push(g)}}
  const glob=Math.min(330,Math.max(120,median(all.slice())||210));
  const len=per.map(a=>a.length?Math.min(720,Math.max(60,median(a))):glob);
  d.est=new Float32Array(n);d.skip=new Uint8Array(n);
  for(let i=0;i<n;i++){const L=len[s[i]];d.est[i]=gap[i]<720?Math.min(gap[i],L*1.05):L;d.skip[i]=gap[i]<30?1:0}
  d.songLen=len;d.aFirst=new Float64Array(artists.length).fill(Infinity);
  for(let i=0;i<n;i++){const a=songs[s[i]].a;if(t[i]<d.aFirst[a])d.aFirst[a]=t[i]}
  return d;
}

/* ---------- Sample data (invented artists) ---------- */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sampleEntries(){
  const r=mulberry32(11),pick=a=>a[Math.floor(r()*a.length)];
  const A1=['Marrow','Velvet','Paper','Neon','Quiet','Copper','Lantern','Static','Harbor','Glass','Hollow','Silver','Wild','Autumn','Satellite','Ember','Northern','Cedar','Lucid','Golden','Tin','Violet'];
  const A2=['Lane','Ordinals','Kites','Atlas','Choir','Signals','Tides','Ghosts','Parade','Motel','Fever','Society','Radio','Machines','Youth','Arcade','Saints','Weather','Club','Orchard','Static'];
  const W=['Midnight','Drive','Heartbeat','Overflow','Summer','Gold','Afterglow','Slow Burn','Blue Hour','Waves','Holding On','Tonight','Echoes','Paper Planes','Low Light','Gravity','Satellites','Fade','Undertow','Wildfire','Neon Rain','Coastline','Polaroid','Run Away','Daydream','Static Heart','Glow','Northbound','Tidal','Velvet Sky','Small Hours','Kerosene','Lemonade','Hurricane','Afterparty','Ghost Town','Mirrorball','Sundown','Rewind','July'];
  const names=new Set();while(names.size<36){names.add((r()<.3?'The ':'')+pick(A1)+' '+pick(A2))}
  const DAYS_N=1095,MONTHS=Math.ceil(DAYS_N/30.44)+1;
  // artist types: steady favorites, short binges, two-era comebacks, and everyone else
  const arts=[...names].map((name,i)=>{const used=new Set(),songs=[],c=4+Math.floor(r()*9);
    while(songs.length<c){let w=pick(W);if(r()<.35)w+=' '+pick(['(Live)','Pt. II','(Acoustic)','Again','Tonight']);if(used.has(w))continue;used.add(w);songs.push({title:w,len:140+r()*190,w:1/Math.pow(songs.length+1,1.1)})}
    const type=i<6?'fav':i<16?'binge':i<24?'redisc':'normal',p1=1+Math.floor(r()*(MONTHS-14)),p2=p1+10+Math.floor(r()*Math.max(1,MONTHS-p1-11));
    return{name,songs,w:1/Math.pow(i+1,.85),type,p1:type==='binge'||type==='normal'?1+Math.floor(r()*(MONTHS-2)):p1,p2}});
  const g=(mo,p,s)=>Math.exp(-((mo-p)**2)/s);
  const wAt=(x,mo)=>x.type==='fav'?x.w*1.6:x.type==='binge'?0.0005+4*g(mo,x.p1,.45):x.type==='redisc'?0.0005+2.2*(g(mo,x.p1,1)+g(mo,x.p2,1)):0.05*x.w+1.1*g(mo,x.p1,5);
  const MW=[...Array(MONTHS)].map((_,mo)=>arts.map(x=>wAt(x,mo)));
  const pickW=(arr,f)=>{let tot=0;for(const x of arr)tot+=f(x);let v=r()*tot;for(const x of arr){v-=f(x);if(v<=0)return x}return arr[arr.length-1]};
  const pickI=ws=>{let tot=0;for(const x of ws)tot+=x;let v=r()*tot;for(let i=0;i<ws.length;i++){v-=ws[i];if(v<=0)return i}return ws.length-1};
  const out=[],now=Date.now(),DAY=864e5,start=now-DAYS_N*DAY;
  const hourW=[3,2,1,.5,.3,.3,.8,2,3,3,2.5,2.5,3,3,3,3.5,4,5,6,6.5,6,5.5,5,4];
  for(let day=0;day<DAYS_N;day++){
    const dt=new Date(start+day*DAY),mo=Math.floor(day/30.44),wk=dt.getDay();if(r()>(wk===0||wk===6?.88:.78))continue;
    const ns=1+Math.floor(r()*(r()<.3?3:2));
    for(let k=0;k<ns;k++){
      const h=pickI(hourW);let t=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),h,Math.floor(r()*60)).getTime();
      const len=4+Math.floor(r()*r()*36);let prev=null;
      for(let j=0;j<len;j++){
        let a,so;if(prev&&r()<.08){a=prev.a;so=prev.so}else{a=arts[pickI(MW[mo])];so=pickW(a.songs,x=>x.w)}
        if(t>now)break;out.push({time:t,title:so.title,url:'',artist:a.name});
        t+=(r()<.1?(5+r()*22):so.len+r()*4)*1000+(r()<.05?r()*90000:0);prev={a,so};
      }
    }
  }
  return out;
}

/* ---------- Storage (this browser only) ---------- */
function idb(){return new Promise((res,rej)=>{try{const q=indexedDB.open('listening-ledger',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})}
async function saveDB(){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put({songs:DB.songs,artists:DB.artists,t:DB.t,s:DB.s,source:DB.source,imported:DB.imported},'current')}catch(e){}}
async function loadDB(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get('current');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function clearDB(){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').delete('current')}catch(e){}}

/* ---------- Aggregation ---------- */
function lowerBound(a,x){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<x)lo=m+1;else hi=m}return lo}
function bounds(){
  const t=DB.t,r=ST.range,now=Date.now();let from=-Infinity,to=Infinity;
  if(r==='30')from=now-30*864e5;else if(r==='90')from=now-90*864e5;else if(r==='365')from=now-365*864e5;
  else if(/^\d{4}$/.test(r)){from=new Date(+r,0,1).getTime();to=new Date(+r+1,0,1).getTime()}
  return[lowerBound(t,from),lowerBound(t,to)];
}
const dayNum=t=>Math.floor((t-new Date(t).getTimezoneOffset()*6e4)/864e5);
function aggregate(){
  const [lo,hi]=bounds(),{t,s,est,skip,songs,artists}=DB,S=songs.length,A=artists.length;
  const sp=new Int32Array(S),sm=new Float64Array(S),ssk=new Int32Array(S),srun=new Int32Array(S),sfirst=new Float64Array(S).fill(Infinity),slast=new Float64Array(S);
  const ap=new Int32Array(A),am=new Float64Array(A),heat=new Float64Array(168),hourM=new Float64Array(24),wdM=new Float64Array(7);
  const days=new Map();let total=0,skips=0,night=0,runSong=-1,runLen=0,runStart=0;const runs=[];
  let sessStart=lo,sessions=0,sessTotal=0,longest=null;const sessList=[];
  for(let i=lo;i<hi;i++){
    const k=s[i],a=songs[k].a,e=est[i],d=new Date(t[i]),h=d.getHours(),w=(d.getDay()+6)%7;
    sp[k]++;sm[k]+=e;if(skip[i]){ssk[k]++;skips++}if(t[i]<sfirst[k])sfirst[k]=t[i];slast[k]=t[i];
    ap[a]++;am[a]+=e;total+=e;heat[w*24+h]+=e/60;hourM[h]+=e/60;wdM[w]+=e/60;if(h<5)night++;
    const dn=Math.floor((t[i]-d.getTimezoneOffset()*6e4)/864e5);let dy=days.get(dn);
    if(!dy){dy={plays:0,min:0,sc:new Map(),t:t[i]};days.set(dn,dy)}dy.plays++;dy.min+=e/60;dy.sc.set(k,(dy.sc.get(k)||0)+1);
    if(k===runSong)runLen++;else{if(runLen>=2)runs.push({k:runSong,len:runLen,t:runStart});runSong=k;runLen=1;runStart=t[i]}
    if(runLen>srun[k])srun[k]=runLen;
    const nx=i+1<hi?t[i+1]:Infinity;
    if(nx-t[i]>30*6e4){const dur=(t[i]-t[sessStart])/1000+e;sessions++;sessTotal+=dur;sessList.push({lo:sessStart,hi:i+1,dur});sessStart=i+1}
  }
  const topSessions=sessList.sort((x,y)=>y.dur-x.dur).slice(0,10);longest=topSessions[0]||null;
  if(runLen>=2)runs.push({k:runSong,len:runLen,t:runStart});
  runs.sort((x,y)=>y.len-x.len||y.t-x.t);
  const plays=hi-lo,songIdx=[],artIdx=[];for(let k=0;k<S;k++)if(sp[k])songIdx.push(k);for(let a=0;a<A;a++)if(ap[a])artIdx.push(a);
  const aSongs=new Int32Array(A);for(const k of songIdx)aSongs[songs[k].a]++;
  // day-level insights
  const dn=[...days.keys()].sort((x,y)=>x-y);let best=0,cur=0,bestEnd=null;
  for(let i=0;i<dn.length;i++){cur=i&&dn[i]===dn[i-1]+1?cur+1:1;if(cur>best){best=cur;bestEnd=dn[i]}}
  let busiest=null,obsession=null;
  for(const [n,dy] of days){if(!busiest||dy.min>busiest.min)busiest={...dy,n};for(const [k,c] of dy.sc)if(!obsession||c>obsession.c)obsession={k,c,t:dy.t}}
  let topOfBusiest=null;if(busiest){let m=0;for(const[k,c]of busiest.sc)if(c>m){m=c;topOfBusiest={k,c}}}
  const tlo=plays?t[lo]:0,thi=plays?t[hi-1]:0;
  const newArtists=artIdx.filter(a=>DB.aFirst[a]>=tlo&&DB.aFirst[a]<=thi);
  return{lo,hi,plays,total,skips,night,sp,sm,ssk,srun,sfirst,slast,ap,am,aSongs,heat,hourM,wdM,days,runs,sessions,sessTotal,longest,topSessions,
    songIdx,artIdx,streak:best,streakEnd:bestEnd,busiest,topOfBusiest,obsession,tlo,thi,newArtists};
}

/* ---------- Charts ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
/* Bar chart: converts minutes to hours when large, labels the unit, states the peak in words, and shows exact values on tap */
function barChart(vals,titles,o={}){
  let unit=o.unit||'',v=vals.slice();
  if(unit==='min'){if(Math.max(0,...v)>=300){v=v.map(x=>x/60);unit='hours'}else unit='minutes'}
  const fv=x=>unit==='hours'?(x>=100?fmtN(x):x.toFixed(1)):fmtN(x);
  const sv=x=>unit==='hours'?(x>=10?String(Math.round(x)):x.toFixed(1)):fmtShort(x);
  const W=o.w||640,H=o.h||210,L=o.left??44,B=24,T=24,R=6,max=niceMax(Math.max(0,...v)),n=v.length||1,bw=(W-L-R)/n,gap=Math.min(bw*.25,4),ticks=o.ticks??4;
  let g=L>0?`<text x="0" y="12" class="ax ttl">${esc(unit)}</text>`:'';
  for(let j=0;j<=ticks;j++){const val=max*j/ticks,y=H-B-(H-B-T)*j/ticks;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"/>`+(L>0?`<text x="${L-6}" y="${y+3.5}" text-anchor="end" class="ax">${sv(val)}</text>`:'')}
  let pk=0;v.forEach((x,i)=>{if(x>v[pk])pk=i});
  const showVals=n<=14&&bw>=26;let b='',hits='';
  v.forEach((x,i)=>{const h=(H-B-T)*x/max,xx=L+i*bw+gap/2,w=Math.max(bw-gap,1),tip=`${titles[i]}: ${fv(x)} ${unit}`;
    b+=`<rect x="${xx.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="${Math.min(2,w/2).toFixed(1)}" class="bar${i===pk&&x>0?' hi':''}"/>`;
    if(showVals&&x>0)b+=`<text x="${(xx+w/2).toFixed(1)}" y="${(H-B-h-4).toFixed(1)}" text-anchor="middle" class="val">${sv(x)}</text>`;
    hits+=`<rect class="hit" x="${(L+i*bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H-B-T}" data-i="${i}" data-tip="${esc(tip)}"><title>${esc(tip)}</title></rect>`});
  const every=Math.ceil(n/(o.maxLabels||8));let xl='';
  for(let i=0;i<n;i+=every)xl+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" class="ax">${esc(o.short?o.short(i):titles[i])}</text>`;
  const avg=v.reduce((a,c)=>a+c,0)/n;
  const sum=o.sum?o.sum({peak:titles[pk],peakV:`${fv(v[pk])} ${unit}`,avg:`${fv(avg)} ${unit}`}):'';
  return`<div class="chartbox">${sum?`<div class="sum">${sum}</div>`:''}<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.label||'Bar chart')}">${g}${b}${xl}${hits}</svg><div class="readout hint" aria-live="polite">Tap any bar to see its exact number.</div></div>`;
}
function timeline(idxIter,lo,hi,label,o={}){
  // idxIter(cb) yields [time, amount]
  if(hi<=lo)return'<p class="fine">No listening in this range.</p>';
  const t0=DB.t[lo],t1=DB.t[hi-1],spanDays=(t1-t0)/864e5,unit=o.unit||'min';
  if(spanDays<=120){
    const d0=dayNum(t0),d1=dayNum(t1),vals=new Array(d1-d0+1).fill(0);idxIter((t,m)=>vals[dayNum(t)-d0]+=m);
    const base=new Date(t0);base.setHours(12,0,0,0);
    const titles=vals.map((_,i)=>new Date(base.getTime()+i*864e5).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}));
    return barChart(vals,titles,{unit,label,maxLabels:6,short:i=>new Date(base.getTime()+i*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric'}),
      sum:o.sum||(p=>`Your biggest day was <b>${esc(p.peak)}</b> with <b>${p.peakV}</b>. On average you listened ${p.avg} a day.`)});
  }
  const a=new Date(t0),b=new Date(t1),m0=a.getFullYear()*12+a.getMonth(),m1=b.getFullYear()*12+b.getMonth(),vals=new Array(m1-m0+1).fill(0);
  idxIter((t,m)=>{const d=new Date(t);vals[d.getFullYear()*12+d.getMonth()-m0]+=m});
  const md=(i,f)=>{const mm=m0+i;return new Date(Math.floor(mm/12),mm%12,1).toLocaleDateString(undefined,f)};
  const titles=vals.map((_,i)=>md(i,{month:'long',year:'numeric'}));
  return barChart(vals,titles,{unit,label,maxLabels:8,short:i=>md(i,{month:'short',year:'2-digit'}),
    sum:o.sum||(p=>`Your biggest month was <b>${esc(p.peak)}</b> with <b>${p.peakV}</b>. On average you listened ${p.avg} a month.`)});
}

/* ---------- Views ---------- */
function songRow(k,i,max,sortBy){
  const g=AGG,so=DB.songs[k],val=sortBy==='minutes'?g.sm[k]:sortBy==='repeat'?g.srun[k]:g.sp[k];
  return`<button class="row" data-song="${k}"><span class="rank">${i+1}</span><span style="min-width:0"><div class="t">${esc(so.title)}</div><div class="a">${esc(DB.artists[so.a])}</div><div class="meter"><i style="width:${(100*val/max).toFixed(1)}%"></i></div></span>
  <span class="stats"><span>${fmtN(g.sp[k])}<small>plays</small></span><span class="opt">${fmtN(Math.max(0,g.sp[k]-1))}<small>replays</small></span><span>${fmtN(g.sm[k]/60)}<small>min</small></span><span class="opt">${g.srun[k]}×<small>in a row</small></span></span></button>`;
}
function artistRow(a,i,max,sortBy){
  const g=AGG,val=sortBy==='minutes'?g.am[a]:sortBy==='songs'?g.aSongs[a]:g.ap[a];
  return`<button class="row" data-artist="${a}"><span class="rank">${i+1}</span><span style="min-width:0"><div class="t">${esc(DB.artists[a])}</div><div class="a">${fmtN(g.aSongs[a])} songs · ${(100*g.ap[a]/Math.max(1,g.plays)).toFixed(1)}% of plays</div><div class="meter"><i style="width:${(100*val/max).toFixed(1)}%"></i></div></span>
  <span class="stats"><span>${fmtN(g.ap[a])}<small>plays</small></span><span>${fmtN(g.am[a]/60)}<small>min</small></span></span></button>`;
}
const sortedSongs=by=>{const g=AGG,f=by==='minutes'?k=>g.sm[k]:by==='repeat'?k=>g.srun[k]*1e6+g.sp[k]:k=>g.sp[k]*1e6+g.sm[k];return g.songIdx.slice().sort((x,y)=>f(y)-f(x))};
const sortedArtists=by=>{const g=AGG,f=by==='minutes'?a=>g.am[a]:by==='songs'?a=>g.aSongs[a]*1e6+g.ap[a]:a=>g.ap[a]*1e6+g.am[a];return g.artIdx.slice().sort((x,y)=>f(y)-f(x))};

function vOverview(){
  const g=AGG;if(!g.plays)return emptyRange();
  const ld=g.days.size,ts=sortedSongs('plays'),ta=sortedArtists('minutes');
  const hero=`<div class="hero">
    <div><h3>Listening time</h3><div class="big">${fmtH(g.total)}<span class="unit">hours</span></div><div class="sub">${fmtN(g.total/60)} minutes, estimated</div></div>
    <div><h3>Plays</h3><div class="big">${fmtN(g.plays)}</div><div class="sub">${fmtN(g.plays/Math.max(1,ld))} per listening day</div></div>
    <div><h3>Songs</h3><div class="big">${fmtN(g.songIdx.length)}</div><div class="sub">${fmtN(g.songIdx.filter(k=>g.sp[k]===1).length)} heard only once</div></div>
    <div><h3>Artists</h3><div class="big">${fmtN(g.artIdx.length)}</div><div class="sub">${fmtN(g.newArtists.length)} new to you</div></div></div>`;

    <div><h2>Top artists by minutes</h2><div class="list">${ta.slice(0,8).map((a,i)=>artistRow(a,i,ma,'minutes')).join('')}</div><button class="btn ghost more" data-go="artists">All ${fmtN(g.artIdx.length)} artists</button></div></div>`;
  const r0=g.runs[0],ob=g.obsession,b=g.busiest,lg=g.longest;

  const ins=[
    r0&&`<div class="ins" data-song="${r0.k}" style="cursor:pointer"><h3>Longest replay streak</h3><div class="v">${r0.len} times in a row</div><div class="d">${so(r0.k)} on ${fmtDate(r0.t)}</div></div>`,
    ob&&`<div class="ins" data-song="${ob.k}" style="cursor:pointer"><h3>Biggest one-day obsession</h3><div class="v">${ob.c} plays in a day</div><div class="d">${so(ob.k)} on ${fmtDate(ob.t)}</div></div>`,
    b&&`<div class="ins"><h3>Busiest day</h3><div class="v">${fmtDur(b.min*60)}</div><div class="d">${fmtDate(b.t)} · ${fmtN(b.plays)} plays${g.topOfBusiest?`, mostly ${so(g.topOfBusiest.k)}`:''}</div></div>`,
    `<div class="ins"><h3>Longest daily streak</h3><div class="v">${g.streak} days</div><div class="d">Listened every day, ending ${g.streakEnd!=null?fmtDate(g.streakEnd*864e5+12*36e5+new Date().getTimezoneOffset()*6e4):'—'}</div></div>`,
    lg&&`<div class="ins"><h3>Longest session</h3><div class="v">${fmtDur(lg.dur)}</div><div class="d">${fmtN(lg.hi-lg.lo)} tracks starting ${fmtDate(DB.t[lg.lo])}</div></div>`,
    `<div class="ins"><h3>Peak listening</h3><div class="v">${DAYS[peakD]}s, ${hourLabel(peakH)}m</div><div class="d"><b>${(100*g.night/g.plays).toFixed(1)}%</b> of plays between midnight and 5am</div></div>`,
    `<div class="ins"><h3>Quick skips</h3><div class="v">${(100*g.skips/g.plays).toFixed(1)}%</div><div class="d"><b>${fmtN(g.skips)}</b> tracks moved on within 30 seconds</div></div>`,
    `<div class="ins"><h3>Replays</h3><div class="v">${(100*(g.plays-g.songIdx.length)/g.plays).toFixed(1)}%</div><div class="d">of plays were songs you'd already heard in this range</div></div>`
  ].filter(Boolean).join('');
  return hero+tl+lists+`<div><h2>Highlights</h2><div class="insights">${ins}</div></div>`;
}
function vSongs(){
  const g=AGG;if(!g.plays)return emptyRange();
  let list=sortedSongs(ST.songSort);const q=ST.q.trim().toLowerCase();
  if(q)list=list.filter(k=>DB.songs[k].title.toLowerCase().includes(q)||DB.artists[DB.songs[k].a].toLowerCase().includes(q));

function vArtists(){
  const g=AGG;if(!g.plays)return emptyRange();

  cardRecord(x,W-150,290,290,share);

  x.fillStyle=INK;x.font=`700 30px ${CBF}`;cardSpacing(x,5);x.fillText('LISTENING LEDGER',L,130);
  x.fillStyle=RED;x.font=`600 28px ${CBF}`;x.fillText(rangeLabel().toUpperCase(),L,176);cardSpacing(x,0);
  // artist name
  const nm=cardName(x,DB.artists[a],RW);let y=790;x.fillStyle=INK;x.font=`800 ${nm.size}px ${CDF}`;
  nm.lines.forEach((l,i)=>x.fillText(l,L,y+i*nm.size*1.02));y+=(nm.lines.length-1)*nm.size*1.02+nm.size*.3;
  // tag pill
  if(tag){x.font=`600 30px ${CBF}`;const tw=x.measureText(tag).width+48;x.fillStyle='#3b0a0a';cardRR(x,L,y+20,tw,58,29);x.fill();x.fillStyle=INK;x.fillText(tag,L+24,y+60);y+=110}else y+=40;
  // stats
  const stats=[[fmtH(g.am[a]),'hours'],[fmtN(g.ap[a]),'plays'],[fmtN(g.aSongs[a]),'songs']];
  let ss=96;x.font=`800 ${ss}px ${CDF}`;while(ss>56&&stats.some(([v])=>x.measureText(v).width>RW/3-64)){ss-=4;x.font=`800 ${ss}px ${CDF}`}
  stats.forEach(([v,lab],i)=>{const X=L+i*(RW/3);x.fillStyle=INK;x.font=`800 ${ss}px ${CDF}`;x.fillText(v,X,y+90);x.fillStyle=MUT;x.font=`500 30px ${CBF}`;x.fillText(lab,X,y+134)});
  y+=200;
  x.fillStyle=INK;x.font=`600 34px ${CBF}`;x.fillText(`#${rank} artist · ${share<.001?'under 0.1':(100*share).toFixed(1)}% of your listening`,L,y+10);y+=50;
  x.fillStyle=TRACK;x.fillRect(L,y,RW,2);y+=66;
  // top songs
  const sparkH=230,footer=130,n=Math.max(0,Math.min(5,songs.length,Math.floor((H-footer-y-70)/86)));
  if(n){x.fillStyle=MUT;x.font=`700 26px ${CBF}`;cardSpacing(x,4);x.fillText('TOP SONGS',L,y);cardSpacing(x,0);y+=64;
    const maxP=g.sp[songs[0]];
    songs.slice(0,n).forEach((k,i)=>{x.fillStyle=RED;x.font=`600 34px ${CMF}`;x.fillText(String(i+1),L,y);
      x.textAlign='right';x.fillStyle=INK;x.font=`600 34px ${CMF}`;const pl=fmtN(g.sp[k]);x.fillText(pl,W-L,y);const pw=x.measureText(pl).width;x.textAlign='left';
      x.fillStyle=INK;x.font=`600 40px ${CBF}`;x.fillText(cardEll(x,DB.songs[k].title,RW-60-pw-30),L+60,y);
      x.fillStyle=TRACK;cardRR(x,L+60,y+20,RW-60,8,4);x.fill();x.fillStyle=RED;cardRR(x,L+60,y+20,Math.max(8,(RW-60)*g.sp[k]/maxP),8,4);x.fill();y+=86});
    y+=10}

  const mm=new Map();for(let i=g.lo;i<g.hi;i++)if(DB.songs[DB.s[i]].a===a){const d=new Date(DB.t[i]),k=d.getFullYear()*12+d.getMonth();mm.set(k,(mm.get(k)||0)+1)}
  if(mm.size>=2&&y+sparkH<=H-footer){
    const ks=[...mm.keys()],k1=Math.max(...ks),k0=Math.max(Math.min(...ks),k1-23),vals=[];for(let k=k0;k<=k1;k++)vals.push(mm.get(k)||0);

    x.fillStyle=MUT;x.font=`500 24px ${CMF}`;x.fillText(monthName(k0,{month:'short',year:'2-digit'}),L,top+bh+40);

async function openCard(a){
  const name=DB.artists[a],file=(name.replace(/[^\w]+/g,'-').replace(/^-|-$/g,'')||'artist')+'-recap.png';
  showSheet(`<div class="head"><div><h3>Recap card · ${esc(rangeLabel())}</h3><h2>${esc(name)}</h2></div><button class="close" aria-label="Close" data-close>×</button></div>
  <div class="cardwrap"><p class="fine" id="cardStatus">Drawing your card…</p><img id="cardImg" alt="Recap card for ${esc(name)}" hidden></div>
  <div class="cardbtns" id="cardBtns" hidden><button class="btn" id="cardShare" type="button">Share</button><a class="btn ghost" id="cardSave" download="${esc(file)}">Save image</a></div>
  <p class="fine" id="cardHint" style="text-align:center">Press and hold the image to save it to your photos. Change the time range at the top to make a card for a different period.</p>`);
  try{
    const blob=await drawArtistCard(a);if(CARD&&CARD.url)URL.revokeObjectURL(CARD.url);
    const url=URL.createObjectURL(blob);CARD={blob,url,file,name};
    const img=$('#cardImg');if(!img)return;img.src=url;img.hidden=false;$('#cardStatus').hidden=true;$('#cardSave').href=url;$('#cardBtns').hidden=false;
  }catch(err){const s=$('#cardStatus');if(s)s.textContent="The card couldn't be drawn on this device. Try again, or try from another browser."}

function shareCard(){
  if(!CARD)return;const f=new File([CARD.blob],CARD.file,{type:'image/png'}),hint=$('#cardHint');
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:`${CARD.name} · Listening Ledger`}).catch(()=>{})}
  else if(hint)hint.textContent="Sharing isn't available here. Press and hold the image to save it, then share it from your photos.";
}

const emptyRange=()=>`<div class="panel"><h2>No plays in this range</h2><p class="fine">Pick a wider time range at the top.</p></div>`;

/* ---------- Detail sheets ---------- */
function monthlyFor(pred,lo,hi){
  const vals=new Map();let first=Infinity,last=0;
  for(let i=lo;i<hi;i++)if(pred(i)){const d=new Date(DB.t[i]),k=d.getFullYear()*12+d.getMonth();vals.set(k,(vals.get(k)||0)+1);if(DB.t[i]<first)first=DB.t[i];last=DB.t[i]}
  if(!vals.size)return'';const ks=[...vals.keys()],m0=Math.min(...ks),m1=Math.max(...ks),arr=[],tt=[];
  for(let m=m0;m<=m1;m++){arr.push(vals.get(m)||0);tt.push(new Date(Math.floor(m/12),m%12,1).toLocaleDateString(undefined,{month:'short',year:'2-digit'}))}
  return barChart(arr,tt,{h:150,left:28,unit:'plays',maxLabels:6,ticks:2,label:'Plays per month'});
}
function openSong(k){
  const g=AGG,so=DB.songs[k],{lo,hi}=g,hours=new Float64Array(24);
  for(let i=lo;i<hi;i++)if(DB.s[i]===k)hours[new Date(DB.t[i]).getHours()]++;
  const ph=[...hours].indexOf(Math.max(...hours));
  const url=/^https:\/\//.test(so.url)?so.url.replace('://www.youtube.com','://music.youtube.com'):'';
  showSheet(`<div class="head"><div><h3>Song</h3><h2>${esc(so.title)}</h2><button class="row" style="padding:0;border:0;display:inline;width:auto" data-artist="${so.a}"><span class="a" style="color:var(--accent)">${esc(DB.artists[so.a])}</span></button></div><button class="close" aria-label="Close" data-close>×</button></div>
  <div class="kv"><div><b>${fmtN(g.sp[k])}</b><span>plays</span></div><div><b>${fmtN(Math.max(0,g.sp[k]-1))}</b><span>replays</span></div><div><b>${fmtN(g.sm[k]/60)}</b><span>minutes listened</span></div>
  <div><b>${g.srun[k]}×</b><span>most in a row</span></div><div><b>${fmtN(g.ssk[k])}</b><span>quick skips</span></div><div><b>${(DB.songLen[k]/60).toFixed(1)} min</b><span>typical length</span></div>
  <div><b>${fmtDate(g.sfirst[k])}</b><span>first play in range</span></div><div><b>${fmtDate(g.slast[k])}</b><span>latest play</span></div><div><b>${hourLabel(ph)}m</b><span>usual hour</span></div></div>
  ${songStory(k)}
  <div><h3>Plays per month</h3>${monthlyFor(i=>DB.s[i]===k,lo,hi)}</div>
  ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Open in YouTube Music</a>`:''}`);
}
function openArtist(a){
  const g=AGG,{lo,hi}=g,songs=g.songIdx.filter(k=>DB.songs[k].a===a).sort((x,y)=>g.sp[y]-g.sp[x]);
  const rank=sortedArtists('plays').indexOf(a)+1,max=g.sp[songs[0]]||1;
  showSheet(`<div class="head"><div><h3>Artist · #${rank} in this range</h3><h2>${esc(DB.artists[a])}</h2>${artistTag(a)}<div style="margin-top:10px"><button class="btn" type="button" data-card="${a}">Make a recap card</button></div></div><button class="close" aria-label="Close" data-close>×</button></div>
  <div class="kv"><div><b>${fmtN(g.ap[a])}</b><span>plays</span></div><div><b>${fmtN(g.am[a]/60)}</b><span>minutes listened</span></div><div><b>${fmtN(songs.length)}</b><span>different songs</span></div>
  <div><b>${(100*g.ap[a]/g.plays).toFixed(1)}%</b><span>of all your plays</span></div><div><b>${fmtDate(DB.aFirst[a])}</b><span>first ever play</span></div><div><b>${fmtN(songs.reduce((s,k)=>s+g.ssk[k],0))}</b><span>quick skips</span></div></div>
  <div><h3>Plays per month</h3>${monthlyFor(i=>DB.songs[DB.s[i]].a===a,lo,hi)}</div>
  <div><h3>Their songs you played</h3><div class="list">${songs.slice(0,30).map((k,i)=>songRow(k,i,max,'plays')).join('')}</div></div>`);

let lastFocus=null;
function showSheet(html){const sh=$('#sheet');lastFocus=document.activeElement;sh.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`;sh.hidden=false;sh.querySelector('.close').focus();sh.querySelector('.card').scrollTop=0}
function closeSheet(){$('#sheet').hidden=true;if(lastFocus)lastFocus.focus()}

/* ---------- Render ---------- */
function rangeOptions(){
  const years=new Set();if(DB.t.length){for(let y=new Date(DB.t[0]).getFullYear();y<=new Date(DB.t[DB.t.length-1]).getFullYear();y++)years.add(y)}
  const opts=[['all','All time'],['30','Last 30 days'],['90','Last 90 days'],['365','Last 12 months'],...[...years].reverse().map(y=>[String(y),String(y)])];
  if(!opts.some(o=>o[0]===ST.range))ST.range='all';
  $('#range').innerHTML=opts.map(([v,l])=>`<option value="${v}"${v===ST.range?' selected':''}>${l}</option>`).join('');
}
function render(){
  AGG=aggregate();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===ST.view));
  $('#src').textContent=DB.isSample?'Sample data · invented artists':`${DB.source||'Your history'} · ${fmtN(DB.t.length)} plays`;
  $('#notice').innerHTML=DB.isSample&&ST.view!=='import'?`<div class="notice"><span class="grow"><b>You're looking at sample data.</b> Import your Google Takeout export to see your own YouTube Music history.</span><button class="btn" data-go="import" type="button">Show me how</button></div>`:'';
  const fn={overview:vOverview,insights:vInsights,songs:vSongs,artists:vArtists,periods:vPeriods,patterns:vPatterns,sessions:vSessions,import:vImport}[ST.view]||vOverview;
  $('#range').disabled=ST.view==='periods';$('#range').title=ST.view==='periods'?'Months & years uses your full history':'';
  $('#view').innerHTML=`<section class="view">${fn()}</section>`;
  const ss=$('#songSort');if(ss)ss.value=ST.songSort;const as=$('#artistSort');if(as)as.value=ST.artistSort;
}
function go(v){ST.view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();window.scrollTo(0,0)}
function setStatus(html,isErr){$('#notice').innerHTML=`<div class="notice${isErr?' err':''}"><span class="grow">${html}</span></div>`}

async function handleFile(file){
  setStatus(`Reading <b>${esc(file.name)}</b>… large exports can take a moment.`);
  await new Promise(r=>setTimeout(r,30));
  try{
    let text,kind;
    if(/\.zip$/i.test(file.name)||/zip/.test(file.type)){
      if(typeof JSZip==='undefined')throw new Error("The zip reader didn't load. Unzip the export and drop watch-history.json instead.");
      const zip=await JSZip.loadAsync(file),c=Object.keys(zip.files).filter(p=>/watch-history\.(json|html)$/i.test(p));
      if(!c.length)throw new Error("This zip has no watch-history file. If Takeout split your export into several zips, try the others, and check that “history” was ticked under YouTube and YouTube Music.");
      const p=c.find(x=>/json$/i.test(x))||c[0];text=await zip.file(p).async('string');kind=/json$/i.test(p)?'json':'html';
    }else{text=await file.text();kind=/^\s*[\[{]/.test(text)?'json':'html'}
    const entries=kind==='json'?parseJSON(text):parseHTML(text);
    if(!entries.length)throw new Error("No YouTube Music plays were found in that file. Make sure it's watch-history from the YouTube and YouTube Music section and that you listened while signed in with history on.");
    DB=build(entries,{source:file.name.replace(/\.(zip|json|html)$/i,''),imported:Date.now(),isSample:false});
    saveDB();ST.range='all';rangeOptions();go('overview');
  }catch(err){setStatus(esc(err.message||String(err)),true)}
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const tip=e.target.closest('.chartbox [data-tip]');
  if(tip){const box=tip.closest('.chartbox'),ro=box.querySelector('.readout');
    if(ro){ro.textContent=tip.dataset.tip;ro.classList.remove('hint')}
    box.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
    if(tip.dataset.i!==undefined){const b=box.querySelectorAll('.bar')[+tip.dataset.i];if(b)b.classList.add('sel')}else tip.classList.add('sel');
    return}
  const el=e.target.closest('[data-close],[data-song],[data-artist],[data-month],[data-year],[data-session],[data-period],[data-card],#cardShare,[data-go],[data-v],#importBtn,#pick,#moreSongs,#moreArtists,#clear,#sessAll');
  if(e.target.id==='sheet'){closeSheet();return}
  if(!el)return;
  if(el.hasAttribute('data-close'))return closeSheet();
  if(el.dataset.month!==undefined)return openMonth(+el.dataset.month);
  if(el.dataset.year!==undefined){ST.year=+el.dataset.year;return render()}
  if(el.dataset.session!==undefined)return openSession(+el.dataset.session);
  if(el.dataset.period!==undefined){ST.period=+el.dataset.period;return render()}
  if(el.dataset.card!==undefined)return openCard(+el.dataset.card);
  if(el.id==='cardShare')return shareCard();
  if(el.id==='sessAll'){ST.sessAll=!ST.sessAll;render();if(!ST.sessAll){const p=$('#sessAll');if(p)p.scrollIntoView({block:'center'})}return}
  if(el.dataset.song!==undefined)return openSong(+el.dataset.song);
  if(el.dataset.artist!==undefined)return openArtist(+el.dataset.artist);
  if(el.dataset.go){closeSheet();return go(el.dataset.go)}
  if(el.dataset.v)return go(el.dataset.v);
  if(el.id==='importBtn')return DB.isSample?go('import'):$('#file').click();
  if(el.id==='pick')return $('#file').click();
  if(el.id==='moreSongs'){ST.songLimit+=100;return render()}
  if(el.id==='moreArtists'){ST.artistLimit+=100;return render()}
  if(el.id==='clear'){clearDB();DB=build(sampleEntries(),{isSample:true});rangeOptions();go('overview')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('change',e=>{
  if(e.target.id==='range'){ST.range=e.target.value;render()}
  if(e.target.id==='otd'&&e.target.value){ST.otd=e.target.value;render()}
  if(e.target.id==='songSort'){ST.songSort=e.target.value;ST.songLimit=50;render()}
  if(e.target.id==='artistSort'){ST.artistSort=e.target.value;ST.artistLimit=50;render()}
  if(e.target.id==='file'&&e.target.files[0]){handleFile(e.target.files[0]);e.target.value=''}
});
let qt;document.addEventListener('input',e=>{
  if(e.target.id!=='q'&&e.target.id!=='aq')return;const id=e.target.id;
  if(id==='q')ST.q=e.target.value;else ST.aq=e.target.value;
  clearTimeout(qt);qt=setTimeout(()=>{const pos=e.target.selectionStart;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},180);
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();const d=$('#drop');if(d)d.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=$('#drop');if(d)d.classList.remove('over')}));
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleFile(f)});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==ST.view&&VIEWS.includes(v)){ST.view=v;render()}});

/* ---------- Boot ---------- */
(function(){
  const h=location.hash.slice(1);if(VIEWS.includes(h))ST.view=h;
  DB=build(sampleEntries(),{isSample:true});rangeOptions();render();
  loadDB().then(saved=>{if(saved&&saved.t&&saved.t.length){DB=finalize({...saved,isSample:false});rangeOptions();render()}});
})();
</script>
